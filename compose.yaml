# Docker Compose setup for local development: the UniSwap API + PostgreSQL 18.
#
# Configuration comes from .env.docker (copy .env.docker.example), passed explicitly:
#   docker compose --env-file .env.docker up -d --build
# It deliberately does NOT use the default .env file, which holds the settings
# for running Node directly on your machine.
name: uniswap

services:
  db:
    image: postgres:18
    environment:
      # ":?" makes Compose stop with this message if the variable is missing,
      # e.g. when --env-file .env.docker was forgotten
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker and pass --env-file .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker and pass --env-file .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker and pass --env-file .env.docker}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
      # Runs ONLY when the data volume is empty (first start). schema.sql uses
      # CREATE ... IF NOT EXISTS and contains no DROP/TRUNCATE.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No "ports:" on purpose: the database is reachable only by the api container.
    # Use `docker compose --env-file .env.docker exec db psql ...` for manual access.

  api:
    build: .
    image: uniswap-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # Inside Compose the database is reached by its service name, not localhost
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env.docker}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Optional: without a real key the API still runs; only POST /ai/chat returns 503
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      # Published on 127.0.0.1 only: reachable from this computer (browser,
      # frontend dev server, curl) but not from other devices on the network
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      # Uploaded listing images survive container rebuilds and restarts
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
